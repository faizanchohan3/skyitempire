<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SkyITEmpire | E-commerce, Digital Marketing &amp; Web Development</title>
    <meta
      name="description"
      content="SkyITEmpire is a software house for e-commerce growth: Amazon, eBay, Etsy, Temu, TikTok Shop and Facebook Shop management, digital marketing and custom web development."
    />
    <meta name="theme-color" content="#f6f8fd" />
    <script>
      // Apply the saved theme before first paint to avoid a flash
      try {
        var t = localStorage.getItem("sky-theme");
        if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <meta property="og:title" content="SkyITEmpire | Build your empire in the digital sky" />
    <meta
      property="og:description"
      content="Marketplace management, performance marketing and high-end web development under one roof."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Loader -->
    <div class="loader" id="loader" aria-hidden="true">
      <div class="loader__mark">
        <svg viewBox="0 0 64 64"><use href="#logo-mark" /></svg>
      </div>
      <div class="loader__bar"><span id="loaderBar"></span></div>
      <p class="loader__text">Launching your empire…</p>
    </div>

    <!-- SVG sprite -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#06b6d4" />
          <stop offset=".55" stop-color="#2563eb" />
          <stop offset="1" stop-color="#9333ea" />
        </linearGradient>
        <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#fde68a" />
          <stop offset=".5" stop-color="#f5b942" />
          <stop offset="1" stop-color="#d48806" />
        </linearGradient>
        <symbol id="logo-mark" viewBox="0 0 64 64">
          <path d="M12 44 L16 22 L25 32 L32 16 L39 32 L48 22 L52 44 Z" fill="url(#brandGrad)" />
          <rect x="12" y="47" width="40" height="5" rx="2.5" fill="url(#brandGrad)" />
        </symbol>
        <symbol id="logo-mark-gold" viewBox="0 0 64 64">
          <path d="M12 44 L16 22 L25 32 L32 16 L39 32 L48 22 L52 44 Z" fill="url(#goldGrad)" />
          <rect x="12" y="47" width="40" height="5" rx="2.5" fill="url(#goldGrad)" />
        </symbol>
        <symbol id="i-star" viewBox="0 0 24 24">
          <path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6L2.5 9.4l6.6-.8z" fill="currentColor" />
        </symbol>
        <symbol id="i-check" viewBox="0 0 24 24">
          <path d="M5 12.5l4.2 4.2L19 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
        </symbol>
      </defs>
    </svg>

    <canvas id="webgl" aria-hidden="true"></canvas>
    <div class="cursor-glow" id="cursorGlow" aria-hidden="true"></div>
    <div class="scroll-progress" id="scrollProgress" aria-hidden="true"></div>

    <!-- Navigation -->
    <header class="nav" id="nav">
      <a href="#top" class="brand" aria-label="SkyITEmpire home">
        <svg class="brand__mark" viewBox="0 0 64 64"><use href="#logo-mark" /></svg>
        <span class="brand__name">Sky<span class="grad">IT</span>Empire</span>
      </a>
      <nav class="nav__links" id="navLinks" aria-label="Primary"></nav>
      <div class="nav__actions">
        <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch to dark theme">
          <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7z" fill="currentColor" /></svg>
          <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="12" cy="12" r="4.5" fill="currentColor" stroke="none" />
            <path d="M12 2v2.5M12 19.5V22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M2 12h2.5M19.5 12H22M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8" />
          </svg>
        </button>
        <button class="nav__toggle" id="navToggle" aria-label="Open menu" aria-expanded="false">
          <span></span><span></span>
        </button>
      </div>
    </header>

    <main id="top">
      <noscript><p style="padding:140px 24px">Please enable JavaScript to view this website.</p></noscript>
    </main>

    <!-- VIP FOOTER (rendered from content) -->
    <footer class="vip-footer" id="footer"></footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
